<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>History — Jeevan Mitra</title>
<link rel="stylesheet" href="../assets/css/tokens.css"/>
<link rel="stylesheet" href="../assets/css/components.css"/>
<link rel="stylesheet" href="../assets/css/app-shell.css"/>
<style>
  .hist-item{display:flex;justify-content:space-between;align-items:center;padding:16px;border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:10px;background:#fff}
  .hist-item .hosp{font-weight:700;font-size:14.5px}
  .hist-item .meta{font-size:12.5px;color:var(--slate);margin-top:2px}
  .hist-points{font-family:var(--font-display);font-weight:700;color:var(--green);font-size:15px}
</style>
</head>
<body>
<div class="app-layout">
  <div id="sidebar-root"></div>
  <div class="app-main">
    <div id="navbar-root"></div>
    <div class="app-content">
      <h2 class="font-display" style="font-family:var(--font-display);font-size:22px;font-weight:700;margin-bottom:20px;">Donation history</h2>
      <div id="hist-list"></div>
    </div>
  </div>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../components/toast.js"></script>
<script src="../components/modal.js"></script>
<script src="../components/navbar.js"></script>
<script src="../components/sidebar.js"></script>
<script>
function historyItem(h){
  const statusLabel = { completed:'Completed', accepted:'Accepted — pending completion', no_show:'No show' }[h.status] || h.status;
  const badge = h.status==='completed' ? 'badge-green' : h.status==='accepted' ? 'badge-amber' : 'badge-slate';
  return `
    <div class="hist-item">
      <div>
        <div class="hosp">${h.hospital?.hospitalName||'Hospital'}</div>
        <div class="meta">${h.hospital?.city||''} · ${new Date(h.acceptedAt).toDateString()}</div>
        <span class="badge ${badge}" style="margin-top:6px;display:inline-block;">${statusLabel}</span>
      </div>
      <div class="hist-points">${h.pointsEarned ? '+'+h.pointsEarned : '—'}</div>
    </div>`;
}

window.addEventListener('DOMContentLoaded', async ()=>{
  const user = await requireAuth('donor');
  if(!user) return;
  renderSidebar('sidebar-root', 'donor', 'history');
  renderNavbar('navbar-root', { variant:'app', title:'History', user });

  const list = document.getElementById('hist-list');
  try{
    const res = await api('/donors/history');
    if(!res.history?.length){
      list.innerHTML = `<div class="empty-state"><div class="icon">📋</div><div class="title">No donations yet</div><div class="sub">Your accepted and completed requests will show up here.</div></div>`;
      return;
    }
    list.innerHTML = res.history.map(historyItem).join('');
  }catch(e){
    list.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><div class="title">Could not load history</div><div class="sub">${e.message}</div></div>`;
  }
});
</script>
</body>
</html>
