<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Profile — Jeevan Mitra</title>
<link rel="stylesheet" href="../assets/css/tokens.css"/>
<link rel="stylesheet" href="../assets/css/components.css"/>
<link rel="stylesheet" href="../assets/css/premium.css"/>
<link rel="stylesheet" href="../assets/css/app-shell.css"/>
<style>
  .avatar-lg{width:64px;height:64px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:24px;margin-bottom:12px}
  .avail-row{display:flex;justify-content:space-between;align-items:center;padding:16px;background:#fff;border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:20px}
  .switch{position:relative;width:46px;height:26px;flex-shrink:0}
  .switch input{opacity:0;width:0;height:0}
  .switch-track{position:absolute;inset:0;background:var(--border);border-radius:99px;transition:.2s;cursor:pointer}
  .switch-track:before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:var(--shadow-sm)}
  input:checked + .switch-track{background:var(--green)}
  input:checked + .switch-track:before{transform:translateX(20px)}
  #qr-img{width:100%;max-width:220px;margin:0 auto;display:block;border-radius:var(--r-md);border:1px solid var(--border)}
</style>
</head>
<body>
<div class="app-layout">
  <div id="sidebar-root"></div>
  <div class="app-main">
    <div id="navbar-root"></div>
    <div class="app-content" style="max-width:520px;">

      <div style="text-align:center;margin-bottom:24px;">
        <div class="avatar-lg" style="margin-left:auto;margin-right:auto;" id="p-avatar">?</div>
        <div style="font-family:var(--font-display);font-size:20px;font-weight:700;" id="p-name">—</div>
        <div style="font-size:13px;color:var(--slate);" id="p-sub">—</div>
      </div>

      <div class="avail-row" id="avail-row" style="display:none;">
        <div>
          <div style="font-weight:700;font-size:14px;">Available to donate</div>
          <div style="font-size:12px;color:var(--slate);" id="avail-hint">Toggle off if you don't want new requests</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="avail-toggle" onchange="toggleAvailability()"/>
          <div class="switch-track"></div>
        </label>
      </div>

      <div class="card" id="qr-card" style="display:none;text-align:center;margin-bottom:20px;">
        <div style="font-weight:700;margin-bottom:10px;">Your donor QR</div>
        <img id="qr-img" alt="Donor QR code"/>
        <div style="font-size:12px;color:var(--slate);margin-top:10px;">Show this at the hospital to verify your donation</div>
      </div>

      <div class="card" style="margin-bottom:16px;">
        <div class="field"><label class="field-label" id="lbl-name">Name</label><input class="field-input" id="f-name"/></div>
        <div class="field"><label class="field-label">Email</label><input class="field-input" id="f-email" type="email"/></div>
        <div class="field"><label class="field-label">City</label><input class="field-input" id="f-city"/></div>
        <button class="btn btn-primary btn-block" onclick="saveProfile()">Save changes</button>
      </div>

      <div class="card" style="margin-bottom:16px;">
        <div style="font-weight:700;margin-bottom:12px;">Change password</div>
        <div class="field"><label class="field-label">New password</label><input class="field-input" id="f-newpass" type="password"/></div>
        <button class="btn btn-outline btn-block" onclick="changePassword()">Update password</button>
      </div>

      <button class="btn btn-danger-outline btn-block" onclick="logout()">Log out</button>

    </div>
  </div>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../components/toast.js"></script>
<script src="../components/modal.js"></script>
<script src="../components/navbar.js"></script>
<script src="../components/sidebar.js"></script>
<script>
let role = null;

async function loadProfile(){
  if(role === 'donor'){
    const res = await api('/donors/profile');
    const d = res.donor;
    document.getElementById('p-avatar').textContent = d.name.charAt(0).toUpperCase();
    document.getElementById('p-name').textContent = d.name;
    document.getElementById('p-sub').textContent = `${d.bloodGroup} · ${d.city}`;
    document.getElementById('f-name').value = d.name;
    document.getElementById('f-email').value = d.email||'';
    document.getElementById('f-city').value = d.city;
    document.getElementById('lbl-name').textContent = 'Name';

    document.getElementById('avail-row').style.display = 'flex';
    document.getElementById('avail-toggle').checked = d.availabilityStatus === 'available';
    if(!res.eligible){
      document.getElementById('avail-toggle').disabled = true;
      document.getElementById('avail-hint').textContent = `In cooldown — ${res.remainingDays} day(s) remaining`;
    }

    document.getElementById('qr-card').style.display = 'block';
    try{
      const qr = await api('/donors/qr');
      document.getElementById('qr-img').src = qr.dataUrl;
    }catch(e){}
  } else if(role === 'hospital'){
    const res = await api('/hospitals/profile');
    const h = res.hospital;
    document.getElementById('p-avatar').textContent = h.hospitalName.charAt(0).toUpperCase();
    document.getElementById('p-name').textContent = h.hospitalName;
    document.getElementById('p-sub').textContent = h.city;
    document.getElementById('f-name').value = h.hospitalName;
    document.getElementById('f-email').value = h.email;
    document.getElementById('f-city').value = h.city;
    document.getElementById('lbl-name').textContent = 'Hospital name';
  }
}

async function saveProfile(){
  const name = document.getElementById('f-name').value.trim();
  const email = document.getElementById('f-email').value.trim();
  const city = document.getElementById('f-city').value.trim();
  try{
    if(role === 'donor') await api('/donors/profile', 'PUT', { name, email, city });
    else await api('/hospitals/profile', 'PUT', { hospitalName: name, email, city });
    showToast('Profile updated', 'success');
  }catch(e){ showToast(e.message, 'error'); }
}

async function changePassword(){
  const password = document.getElementById('f-newpass').value;
  if(!password || password.length < 6) return showToast('Password must be at least 6 characters', 'error');
  try{
    const endpoint = role === 'donor' ? '/donors/change-password' : '/hospitals/change-password';
    await api(endpoint, 'PUT', { password });
    showToast('Password updated', 'success');
    document.getElementById('f-newpass').value = '';
  }catch(e){ showToast(e.message, 'error'); }
}

async function toggleAvailability(){
  try{
    const res = await api('/donors/availability', 'PUT');
    showToast(`You're now ${res.availabilityStatus}`, 'success');
  }catch(e){
    showToast(e.message, 'error');
    document.getElementById('avail-toggle').checked = !document.getElementById('avail-toggle').checked;
  }
}

window.addEventListener('DOMContentLoaded', async ()=>{
  const savedRole = getRole();
  const user = await requireAuth(savedRole);
  if(!user) return;
  role = savedRole;

  renderSidebar('sidebar-root', role, 'profile');
  renderNavbar('navbar-root', { variant:'app', title:'Profile', user });
  loadProfile();
});
</script>
</body>
</html>
